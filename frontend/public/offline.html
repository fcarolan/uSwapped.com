<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USwapped — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAFAF7; font-family: system-ui, sans-serif; color: #0f172a; }
      .card { border: 2px solid #0f172a; box-shadow: 4px 4px 0 #0f172a; border-radius: 24px; background: #fff; padding: 32px; max-width: 320px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; border: 2px solid #0f172a; }
      button { margin-top: 16px; border: 2px solid #0f172a; background: #0f172a; color: #fff; border-radius: 999px; padding: 10px 20px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="USwapped" />
      <h1>You're offline</h1>
      <p>Reconnect to keep swapping — your items and credits are safe.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
